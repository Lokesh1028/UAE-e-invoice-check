# Fly.io: `fly launch --copy-config --no-deploy` then `fly deploy`
app = "uae-einvoice-check"      # change to your app name
primary_region = "fra"           # closest Fly region to the UAE with good capacity (or "bom" for India)

[build]
  dockerfile = "Dockerfile"

[env]
  WEB_CONCURRENCY = "2"
  RATE_LIMIT_PER_MIN = "40"
  RATE_LIMIT_BURST = "15"
  HEAVY_CONCURRENCY = "2"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"      # scale to zero when idle: near-zero cost
  auto_start_machines = true
  min_machines_running = 0         # set to 1 once traffic is steady (avoids 2-3 s cold start)
  processes = ["app"]
  [http_service.concurrency]
    type = "requests"
    soft_limit = 25                # Fly starts another machine above this
    hard_limit = 60

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

[mounts]
  source = "data"
  destination = "/srv/data"
  initial_size = "1gb"
